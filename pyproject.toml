[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule_agent"
version = "0.1.0"
description = "素材审核与排期草稿 Agent（无发布能力）"
requires-python = ">=3.10"
dependencies = ["openai>=1.30,<3", "python-dotenv>=1,<2", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<10"]

[project.scripts]
schedule-agent = "schedule_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
